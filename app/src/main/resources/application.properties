# Configuración del control. EXAM_ID, GIT_COMMIT, DB_HOST, DB_NAME, SECRET_NAME y AWS_REGION llegan como
# variables de entorno del contenedor (las pone el docker run del user data, en cdk/control_visitas/stack.py).
server.port=8080

control-visitas.exam-id=${EXAM_ID:}
control-visitas.commit=${GIT_COMMIT:desconocido}
control-visitas.db-host=${DB_HOST:}
control-visitas.secret-name=${SECRET_NAME:}

# El secreto aporta username y password.
spring.config.import=optional:aws-secretsmanager:${SECRET_NAME:sin-secreto}
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# Aurora PostgreSQL. El profesor exige TLS (sslmode=require).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:db_control_visitas}?sslmode=require&connectTimeout=5
spring.datasource.username=${username:}
spring.datasource.password=${password:}
# Pool pequeño, y que un fallo de conexión se vea en 5 segundos, no en 30
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=5000
